name = "chaniajobsai"
main = "index.js"
compatibility_date = "2026-10-25"

[observability]
enabled = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "chania-db"
database_id = "a831a7e7-5aa0-4b9a-a49f-512d3cfe6dc5"

[[vectorize]]
binding = "PROFILE_VEC"
index_name = "chania-profiles"

[[vectorize]]
binding = "JOB_VEC"
index_name = "chania-jobs"

# 13:01 UTC = 16:01 EAT, the daily Bright Data pull.
# Keep this to one entry: every cron run triggers a pull.
[triggers]
crons = ["1 13 * * *"]

[vars]
ALLOWED_ORIGIN = "*"
WORKER_URL = "https://chaniajobsai.muchirirobinson49.workers.dev"
MATCH_THRESHOLD = "0.68"
MATCH_CAP = "20"
BRIGHTDATA_DATASET_ID = "gd_lpfll7v5hcqtkxl6l"
BRIGHTDATA_INPUTS = '[{"location":"Nairobi","keyword":"data analyst","country":"KE"},{"location":"Kenya","keyword":"software developer","country":"KE"}]'
