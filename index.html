<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CHANIA AI - Smart Job Matching</title>

    <!-- PWA Metadata Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF5500">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Vivid Orange Premium Accent Color & Gradient */
            --accent-orange: #FF5500;
            --accent-orange-hover: #E04B00;
            --accent-orange-light: rgba(255, 85, 0, 0.10);
            --accent-orange-glow: rgba(255, 85, 0, 0.22);
            --premium-orange-gradient: linear-gradient(135deg, #FF7700 0%, #FF3300 100%);
            
            /* Deep Vivid Premium Blue Color for Verification Badges */
            --deep-vivid-blue: #0052FF;
            --deep-vivid-blue-light: rgba(0, 82, 255, 0.10);
            --deep-vivid-blue-glow: rgba(0, 82, 255, 0.22);

            /* Premium Vivid Green (Replaced Emerald Green) */
            --emerald-green: #00C853;
            --emerald-green-light: rgba(0, 200, 83, 0.12);
            --emerald-green-glow: rgba(0, 200, 83, 0.25);
            
            /* Status Colors */
            --status-applied-bg: rgba(0, 200, 83, 0.12);
            --status-applied-text: #00C853;
            --status-pending-bg: rgba(245, 158, 11, 0.12);
            --status-pending-text: #f59e0b;
            
            /* Theme Base Colors (Default Light) */
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --bg-sticky: #ffffff;
            --bg-surface: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #f1f5f9;
            --border-subtle: #e2e8f0;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.03);

            /* Floating Action Button Theme Defaults */
            --fab-bg: #FFFFFF;
            --fab-shadow: 0 6px 20px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
            --fab-border: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* True Black Dark Mode */
        body.dark-theme {
            --bg-app: #000000;
            --bg-card: #0a0a0a;
            --bg-sticky: #000000;
            --bg-surface: #121212;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #161616;
            --border-subtle: #242424;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);

            --fab-bg: #0d0d0d;
            --fab-shadow: 0 8px 24px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 85, 0, 0.25);
            --fab-border: 1px solid rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            width: 100vw;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .phone-frame {
            width: 100vw;
            min-height: 100vh;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        /* NATIVE STICKY TOP CONTAINER */
        .sticky-top-section {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            background: var(--bg-sticky);
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            flex-shrink: 0;
            padding-top: env(safe-area-inset-top);
            width: 100%;
            
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        /* App Header */
        .app-header {
            padding: 12px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .svg-logo-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text-primary);
        }

        .brand-text span {
            color: var(--accent-orange);
        }

        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        /* Top-Bar Control Area */
        .header-context-bar {
            background: var(--bg-sticky);
            padding: 6px 20px 12px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .header-context-bar.hidden {
            display: none;
        }

        /* Filter Chips Bar */
        .chip-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-chip {
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-chip.active {
            background: var(--premium-orange-gradient);
            color: white;
            border-color: transparent;
            font-weight: 700;
        }

        /* Summary Counter Panel */
        .summary-banner {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 9px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-subtle);
        }

        .summary-title {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-count {
            background: var(--accent-orange-light);
            color: var(--accent-orange);
            font-size: 10.5px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 10px;
        }

        /* App Body Scroll Container */
        .app-body {
            flex: 1;
            padding: 16px 20px 90px 20px;
            background: var(--bg-app);
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Floating Action Button (FAB) */
        .fab-kazini {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--fab-bg);
            border: var(--fab-border);
            box-shadow: var(--fab-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fab-kazini:active {
            transform: scale(0.90);
        }

        /* Scalloped Badge */
        .scalloped-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            filter: drop-shadow(0px 1px 3px var(--deep-vivid-blue-glow));
            vertical-align: middle;
        }

        .scalloped-badge.lg {
            width: 20px;
            height: 20px;
        }

        /* Tab Views */
        .tab-view {
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }

        .tab-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Job Cards Styling */
        .job-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .job-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            position: relative;
            transition: all 0.2s ease;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .job-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.35;
        }

        .company-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .location-dot {
            color: var(--text-muted);
            font-size: 8px;
        }

        .bookmark-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .bookmark-btn:active {
            transform: scale(0.85);
        }

        .skills-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .skill-badge {
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .skill-badge.more {
            background: var(--accent-orange-light);
            color: var(--accent-orange);
            font-weight: 700;
        }

        .salary-text {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .match-score {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--emerald-green);
        }

        .view-btn {
            background: var(--premium-orange-gradient);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px var(--accent-orange-glow);
            transition: all 0.2s;
        }

        .view-btn:active {
            transform: scale(0.95);
        }

        /* Slim Cards */
        .slim-card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slim-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slim-job-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .slim-company-name {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .slim-meta-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .status-applied-pill {
            background: var(--status-applied-bg);
            color: var(--status-applied-text);
            font-size: 10.5px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-pending-pill {
            background: var(--status-pending-bg);
            color: var(--status-pending-text);
            font-size: 10.5px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Profile Section */
        .glass-panel {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--border-color);
            margin-bottom: 14px;
            box-shadow: var(--card-shadow);
        }

        .section-label-modal {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-orange);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .detail-block {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-subtle);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-sticky);
            border-top: 1px solid var(--border-color);
            padding: 8px 16px max(12px, env(safe-area-inset-bottom)) 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-muted);
            font-size: 10.5px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            padding: 2px 12px;
        }

        .nav-item.active {
            color: var(--accent-orange);
        }

        /* Modals Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            justify-content: flex-end;
            flex-direction: column;
            align-items: center;
        }

        /* Job Details Modal Card */
        .job-modal-card {
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            height: 88vh;
            max-height: 88vh;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid var(--border-subtle);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .job-modal-sticky-header {
            padding: 16px 20px 12px 20px;
            background: var(--bg-sticky);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .job-modal-scroll-body {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: var(--bg-app);
        }

        .job-modal-scroll-body::-webkit-scrollbar {
            display: none;
        }

        .job-modal-sticky-footer {
            padding: 14px 20px max(14px, env(safe-area-inset-bottom)) 20px;
            background: var(--bg-sticky);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .apply-btn-full {
            width: 100%;
            background: var(--premium-orange-gradient);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 800;
            margin-top: 0;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-orange-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .apply-btn-full:active {
            transform: scale(0.97);
        }

        .studio-editable {
            cursor: text;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .studio-editable:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px var(--accent-orange-glow);
        }

        /* APPLICATION STUDIO MODAL & CHAT UI */
        .chat-modal-card, .studio-modal-card {
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            height: 88vh;
            max-height: 88vh;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid var(--border-subtle);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-sticky);
            flex-shrink: 0;
        }

        .chat-messages-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-app);
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.45;
            animation: fadeIn 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        .chat-bubble.assistant {
            background: var(--bg-surface);
            color: var(--text-primary);
            align-self: flex-start;
            border: 1px solid var(--border-subtle);
            border-top-left-radius: 4px;
        }

        .chat-bubble.user {
            background: var(--premium-orange-gradient);
            color: white;
            align-self: flex-end;
            border-top-right-radius: 4px;
            box-shadow: 0 4px 14px var(--accent-orange-glow);
        }

        .msg-meta-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 2px;
            font-size: 10px;
            color: var(--text-muted);
            align-self: flex-end;
        }

        .quick-replies-footer {
            padding: 10px 16px;
            background: var(--bg-sticky);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-shrink: 0;
            white-space: nowrap;
            align-items: center;
        }

        .quick-reply-chip {
            background: var(--premium-orange-gradient);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 10px var(--accent-orange-glow);
            flex-shrink: 0;
        }

        .pc{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:20px;overflow:hidden;box-shadow:var(--card-shadow)}
        .pc-top{display:flex;gap:12px;align-items:center;padding:16px;background:linear-gradient(135deg,var(--accent-orange-light),var(--emerald-green-light))}
        .pc-av{position:relative;width:62px;height:62px;border-radius:50%;background:var(--premium-orange-gradient);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:3px solid var(--bg-card);overflow:hidden}
        .ai-mode{display:inline-flex;align-items:center;gap:7px;background:var(--emerald-green-light);color:var(--emerald-green);border:1px solid var(--emerald-green);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:800}
        .live-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald-green);animation:livePulse 1.3s infinite}
        @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(0,200,83,.6);opacity:1}70%{box-shadow:0 0 0 8px rgba(0,200,83,0);opacity:.5}100%{box-shadow:0 0 0 0 rgba(0,200,83,0);opacity:1}}
        .pf-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1.5px solid var(--border-subtle);color:var(--text-secondary);border-radius:12px;padding:6px 12px;font-size:11.5px;font-weight:800;cursor:pointer}

        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            border-top-left-radius: 4px;
            align-self: flex-start;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-orange);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: 0 0 6px var(--accent-orange-glow);
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        .chat-input-area {
            padding: 12px 16px max(16px, env(safe-area-inset-bottom)) 16px;
            background: var(--bg-sticky);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 11px 14px;
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        .chat-send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--premium-orange-gradient);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Profile picture ring color changed to black in Dark Mode */
        .chat-avatar-wrapper {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            transition: box-shadow 0.3s ease;
        }
        
        body.dark-theme .chat-avatar-wrapper {
            box-shadow: 0 0 0 3px #000000, 0 3px 12px rgba(255, 85, 0, 0.3);
        }

        .chat-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-subtle);
        }

        .bot-row { display: flex; align-items: flex-start; gap: 8px; align-self: flex-start; width: 100%; }
        .bot-mini-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1.5px solid var(--border-subtle); background: var(--bg-surface); margin-top: 2px; }
        body.dark-theme .bot-mini-avatar { border-color: #000000; box-shadow: 0 0 0 1.5px #000000; }

        /* Glow effect completely removed from typing status */
        .agent-typing { color: #00E676 !important; font-weight: 800 !important; letter-spacing: 0.2px; text-shadow: none !important; }
        .agent-typing .td { animation: tdBlink 1.2s infinite both; }
        @keyframes tdBlink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    </style>
</head>
<body class="dark-theme">

    <div class="phone-frame">
        <div class="sticky-top-section">
            <div class="app-header">
                <div class="brand-logo">
                    <div class="svg-logo-icon">
                        <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="18" y="34" width="64" height="48" rx="12" stroke="#FF5500" stroke-width="8" fill="none"/>
                            <path d="M38 34 V22 C38 18.5 41 16 45 16 H55 C59 16 62 18.5 62 22 V34" stroke="#FF5500" stroke-width="8" fill="none" stroke-linecap="round"/>
                            <path d="M82 10 Q82 22 94 22 Q82 22 82 34 Q82 22 70 22 Q82 22 82 10 Z" fill="#FF5500"/>
                        </svg>
                    </div>
                    <div class="brand-text">Chania <span>AI</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle Theme">
                    <i data-lucide="sun" id="themeIcon" style="width:18px; height:18px;"></i>
                </button>
            </div>
            <div class="header-context-bar" id="headerContextContainer"></div>
        </div>

        <div class="app-body">
            <div class="tab-view active" id="discoverTab"><div class="job-list" id="jobList"></div></div>
            <div class="tab-view" id="savedTab"><div class="slim-card-list" id="savedJobList"></div></div>
            <div class="tab-view" id="appliedTab"><div class="slim-card-list" id="appliedJobList"></div></div>
            <div class="tab-view" id="profileTab"><div id="profileView"></div></div>
        </div>

        <button class="fab-kazini" onclick="openChatModal()" aria-label="Open Chania Assistant">
            <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="18" y="34" width="64" height="48" rx="12" stroke="#FF5500" stroke-width="8" fill="none"/>
                <path d="M38 34 V22 C38 18.5 41 16 45 16 H55 C59 16 62 18.5 62 22 V34" stroke="#FF5500" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M82 10 Q82 22 94 22 Q82 22 82 34 Q82 22 70 22 Q82 22 82 10 Z" fill="#FF5500"/>
            </svg>
        </button>

        <div class="bottom-nav">
            <div class="nav-container">
                <div class="nav-item active" onclick="switchTab(this, 'discoverTab')"><i data-lucide="compass" style="width:20px; height:20px;"></i><span>Discover</span></div>
                <div class="nav-item" onclick="switchTab(this, 'savedTab')"><i data-lucide="heart" style="width:20px; height:20px;"></i><span>Saved</span></div>
                <div class="nav-item" onclick="switchTab(this, 'appliedTab')"><i data-lucide="clipboard-list" style="width:20px; height:20px;"></i><span>Applied</span></div>
                <div class="nav-item" onclick="switchTab(this, 'profileTab')"><i data-lucide="user" style="width:20px; height:20px;"></i><span>Profile</span></div>
            </div>
        </div>

        <!-- JOB DETAILS MODAL -->
        <div class="modal-overlay" id="jobModal" onclick="closeModal()">
            <div class="job-modal-card" onclick="event.stopPropagation()">
                <div class="job-modal-sticky-header">
                    <div style="width: 36px; height: 4px; background: var(--border-subtle); border-radius: 2px; margin: 0 auto 10px auto;"></div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h2 id="modalTitle" style="font-size: 17px; font-weight: 800; color: var(--text-primary); line-height: 1.2; margin-bottom: 4px;"></h2>
                            <div id="modalCompany" style="color: var(--text-secondary); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 5px;"></div>
                        </div>
                        <button onclick="closeModal()" style="background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 4px;"><i data-lucide="x" style="width: 20px; height: 20px;"></i></button>
                    </div>
                </div>
                <div class="job-modal-scroll-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
                        <div class="detail-block" style="margin-bottom:0;">
                            <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Est. Salary</div>
                            <div id="modalSalary" style="font-size: 12.5px; font-weight: 700; color: var(--emerald-green); margin-top: 3px;"></div>
                        </div>
                        <div class="detail-block" style="margin-bottom:0;">
                            <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">AI Match Score</div>
                            <div id="modalMatch" style="font-size: 12.5px; font-weight: 800; color: var(--emerald-green); margin-top: 3px;"></div>
                        </div>
                    </div>
                    <div class="section-label-modal"><i data-lucide="align-left" style="width: 12px; height: 12px;"></i> About the job</div>
                    <div class="detail-block"><p style="font-size: 12px; color: var(--text-secondary); line-height: 1.5;" id="modalDesc"></p></div>
                </div>
                <div class="job-modal-sticky-footer">
                    <button class="apply-btn-full" id="applyActionBtn" onclick="handleApplyButtonClick()">
                        <i data-lucide="file-plus-2" style="width: 15px; height: 15px;"></i> Generate CV
                    </button>
                </div>
            </div>
        </div>

        <!-- APPLICATION STUDIO MODAL -->
        <div class="modal-overlay" id="applicationStudioModal" onclick="closeApplicationStudio()">
            <div class="studio-modal-card" onclick="event.stopPropagation()">
                <div style="padding: 20px 20px 14px 20px; border-bottom: 1px solid var(--border-color); background: var(--bg-sticky); flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
                    <div style="min-width: 0;">
                        <h2 id="studioJobTitle" style="font-size: 17px; font-weight: 800; color: var(--text-primary); line-height: 1.2; margin-bottom: 4px;"></h2>
                        <div id="studioJobCompany" style="color: var(--text-secondary); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 5px;"></div>
                    </div>
                    <button onclick="closeApplicationStudio()" style="background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 4px;"><i data-lucide="x" style="width: 20px; height: 20px;"></i></button>
                </div>
                <div style="padding: 16px 20px; overflow-y: auto; flex: 1; background: var(--bg-app);">
                    <div class="detail-block studio-editable" contenteditable="true">
                        <p style="font-size: 13px; font-weight: 700; color: var(--text-primary);">Application Studio Content Ready</p>
                    </div>
                </div>
                <div style="padding: 14px 20px; border-top: 1px solid var(--border-color); background: var(--bg-sticky);">
                    <button class="apply-btn-full" id="studioSubmitBtn" onclick="submitApplicationFromStudio()">
                        <i data-lucide="send" style="width: 15px; height: 15px;"></i> Submit Application
                    </button>
                </div>
            </div>
        </div>

        <!-- CHAT UI MODAL -->
        <div class="modal-overlay" id="chatModal" onclick="closeChatModal()">
            <div class="chat-modal-card" onclick="event.stopPropagation()">
                <div class="chat-header">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div class="chat-avatar-wrapper">
                            <img src="kazini-ai-avatar.png" alt="Chania AI" class="chat-avatar-img">
                            <span style="position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: var(--emerald-green); border: 2.5px solid var(--bg-sticky); border-radius: 50%;"></span>
                        </div>
                        <div>
                            <div style="font-size: 14.5px; font-weight: 800; color: var(--text-primary);">Chania AI</div>
                            <div id="agentStatus" style="font-size: 11px; color: var(--emerald-green); font-weight: 700; margin-top: 2px;">Job Hunting Agent</div>
                        </div>
                    </div>
                    <button onclick="closeChatModal()" style="background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 4px;"><i data-lucide="x" style="width: 20px; height: 20px;"></i></button>
                </div>
                <div class="chat-messages-container" id="chatMessages"></div>
                <div class="quick-replies-footer" id="quickRepliesFooter" style="display:none"></div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Type your response..." onkeypress="handleChatKeypress(event)">
                    <button class="chat-send-btn" onclick="sendChatMessage()"><i data-lucide="send" style="width: 16px; height: 16px;"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function toggleTheme() { document.body.classList.toggle('dark-theme'); }
        function openModal(id) { document.getElementById('jobModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('jobModal').style.display = 'none'; }
        function openApplicationStudio() { document.getElementById('applicationStudioModal').style.display = 'flex'; }
        function closeApplicationStudio() { document.getElementById('applicationStudioModal').style.display = 'none'; }
        function handleApplyButtonClick() { closeModal(); openApplicationStudio(); }
        function openChatModal() { document.getElementById('chatModal').style.display = 'flex'; }
        function closeChatModal() { document.getElementById('chatModal').style.display = 'none'; }
        function switchTab(el, tabId) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
