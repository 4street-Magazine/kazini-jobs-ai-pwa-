<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CHANIA AI - Smart Job Matching</title>

    <!-- PWA Metadata Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF5500">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Vivid Orange Premium Accent Color & Gradient */
            --accent-orange: #FF5500;
            --accent-orange-hover: #E04B00;
            --accent-orange-light: rgba(255, 85, 0, 0.10);
            --accent-orange-glow: rgba(255, 85, 0, 0.22);
            --premium-orange-gradient: linear-gradient(135deg, #FF7700 0%, #FF3300 100%);
            
            /* Deep Vivid Premium Blue Color for Verification Badges */
            --deep-vivid-blue: #0052FF;
            --deep-vivid-blue-light: rgba(0, 82, 255, 0.10);
            --deep-vivid-blue-glow: rgba(0, 82, 255, 0.22);

            /* Premium Vivid Green (Replaced Emerald Green) */
            --emerald-green: #00C853;
            --emerald-green-light: rgba(0, 200, 83, 0.12);
            --emerald-green-glow: rgba(0, 200, 83, 0.25);
            
            /* Status Colors */
            --status-applied-bg: rgba(0, 200, 83, 0.12);
            --status-applied-text: #00C853;
            --status-pending-bg: rgba(245, 158, 11, 0.12);
            --status-pending-text: #f59e0b;
            
            /* Theme Base Colors (Default Light) */
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --bg-sticky: #ffffff;
            --bg-surface: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #f1f5f9;
            --border-subtle: #e2e8f0;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.03);

            /* Floating Action Button Theme Defaults */
            --fab-bg: #FFFFFF;
            --fab-shadow: 0 6px 20px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
            --fab-border: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* True Black Dark Mode */
        body.dark-theme {
            --bg-app: #000000;
            --bg-card: #0a0a0a;
            --bg-sticky: #000000;
            --bg-surface: #121212;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #161616;
            --border-subtle: #242424;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);

            --fab-bg: #0d0d0d;
            --fab-shadow: 0 8px 24px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 85, 0, 0.25);
            --fab-border: 1px solid rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            width: 100vw;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .phone-frame {
            width: 100vw;
            min-height: 100vh;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        /* NATIVE STICKY TOP CONTAINER */
        .sticky-top-section {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            background: var(--bg-sticky);
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            flex-shrink: 0;
            padding-top: env(safe-area-inset-top);
            width: 100%;
            
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        /* App Header */
        .app-header {
            padding: 12px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .svg-logo-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text-primary);
        }

        .brand-text span {
            color: var(--accent-orange);
        }

        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        /* Top-Bar Control Area */
        .header-context-bar {
            background: var(--bg-sticky);
            padding: 6px 20px 12px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .header-context-bar.hidden {
            display: none;
        }

        /* Filter Chips Bar */
        .chip-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-chip {
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-chip.active {
            background: var(--premium-orange-gradient);
            color: white;
            border-color: transparent;
            font-weight: 700;
        }

        /* Summary Counter Panel */
        .summary-banner {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 9px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-subtle);
        }

        .summary-title {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-count {
            background: var(--accent-orange-light);
            color: var(--accent-orange);
            font-size: 10.5px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 10px;
        }

        /* App Body Scroll Container */
        .app-body {
            flex: 1;
            padding: 16px 20px 90px 20px;
            background: var(--bg-app);
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Floating Action Button (FAB) */
        .fab-kazini {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--fab-bg);
            border: var(--fab-border);
            box-shadow: var(--fab-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fab-kazini:active {
            transform: scale(0.90);
        }

        /* Scalloped Badge */
        .scalloped-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            filter: drop-shadow(0px 1px 3px var(--deep-vivid-blue-glow));
            vertical-align: middle;
        }

        .scalloped-badge.lg {
            width: 20px;
            height: 20px;
        }

        /* Tab Views */
        .tab-view {
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }

        .tab-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Job Cards Styling */
        .job-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .job-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            position: relative;
            transition: all 0.2s ease;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .job-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.35;
        }

        .company-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .location-dot {
            color: var(--text-muted);
            font-size: 8px;
        }

        .bookmark-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .bookmark-btn:active {
            transform: scale(0.85);
        }

        .skills-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .skill-badge {
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .skill-badge.more {
            background: var(--accent-orange-light);
            color: var(--accent-orange);
            font-weight: 700;
        }

        .salary-text {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .match-score {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--emerald-green);
        }

        .view-btn {
            background: var(--premium-orange-gradient);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px var(--accent-orange-glow);
            transition: all 0.2s;
        }

        .view-btn:active {
            transform: scale(0.95);
        }

        /* Slim Cards */
        .slim-card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slim-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slim-job-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .slim-company-name {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .slim-meta-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Profile Section */
        .glass-panel {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--border-color);
            margin-bottom: 14px;
            box-shadow: var(--card-shadow);
        }

        .section-label-modal {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-orange);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .detail-block {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-subtle);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-sticky);
            border-top: 1px solid var(--border-color);
            padding: 8px 16px max(12px, env(safe-area-inset-bottom)) 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-muted);
            font-size: 10.5px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            padding: 2px 12px;
        }

        .nav-item.active {
            color: var(--accent-orange);
        }

        /* Modals Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            justify-content: flex-end;
            flex-direction: column;
            align-items: center;
        }

        /* Job Details Modal Card */
        .job-modal-card {
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            height: 88vh;
            max-height: 88vh;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid var(--border-subtle);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .job-modal-sticky-header {
            padding: 16px 20px 12px 20px;
            background: var(--bg-sticky);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .job-modal-scroll-body {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: var(--bg-app);
        }

        .job-modal-sticky-footer {
            padding: 14px 20px max(14px, env(safe-area-inset-bottom)) 20px;
            background: var(--bg-sticky);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .apply-btn-full {
            width: 100%;
            background: var(--premium-orange-gradient);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-orange-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .apply-btn-full:active {
            transform: scale(0.97);
        }

        /* CHAT UI & APPLICATION STUDIO */
        .chat-modal-card, .studio-modal-card {
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            height: 88vh;
            max-height: 88vh;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid var(--border-subtle);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-sticky);
            flex-shrink: 0;
        }

        .chat-messages-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-app);
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.45;
            animation: fadeIn 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        .chat-bubble.assistant {
            background: var(--bg-surface);
            color: var(--text-primary);
            align-self: flex-start;
            border: 1px solid var(--border-subtle);
            border-top-left-radius: 4px;
        }

        .chat-bubble.user {
            background: var(--premium-orange-gradient);
            color: white;
            align-self: flex-end;
            border-top-right-radius: 4px;
            box-shadow: 0 4px 14px var(--accent-orange-glow);
        }

        .quick-replies-footer {
            padding: 10px 16px;
            background: var(--bg-sticky);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-shrink: 0;
            white-space: nowrap;
            align-items: center;
        }

        .quick-replies-footer::-webkit-scrollbar {
            display: none;
        }

        .quick-reply-chip {
            background: var(--premium-orange-gradient);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 10px var(--accent-orange-glow);
            flex-shrink: 0;
        }

        .quick-reply-chip:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .chat-input-area {
            padding: 12px 16px max(16px, env(safe-area-inset-bottom)) 16px;
            background: var(--bg-sticky);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 11px 14px;
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--accent-orange);
        }

        .chat-send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--premium-orange-gradient);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--accent-orange-glow);
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .chat-avatar-wrapper {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .chat-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-subtle);
        }
    </style>
</head>
<body class="dark-theme">

    <div class="phone-frame">
        <!-- STICKY TOP SECTION -->
        <div class="sticky-top-section">
            <div class="app-header">
                <div class="brand-logo">
                    <div class="svg-logo-icon">
                        <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="18" y="34" width="64" height="48" rx="12" stroke="#FF5500" stroke-width="8" fill="none"/>
                            <path d="M38 34 V22 C38 18.5 41 16 45 16 H55 C59 16 62 18.5 62 22 V34" stroke="#FF5500" stroke-width="8" fill="none" stroke-linecap="round"/>
                            <path d="M82 10 Q82 22 94 22 Q82 22 82 34 Q82 22 70 22 Q82 22 82 10 Z" fill="#FF5500"/>
                        </svg>
                    </div>
                    <div class="brand-text">Chania <span>AI</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle Theme">
                    <i data-lucide="sun" id="themeIcon" style="width:18px; height:18px;"></i>
                </button>
            </div>
            <div class="header-context-bar" id="headerContextContainer"></div>
        </div>

        <!-- Scrollable Body Content -->
        <div class="app-body">
            <div class="tab-view active" id="discoverTab">
                <div class="job-list" id="jobList"></div>
            </div>
            <div class="tab-view" id="savedTab">
                <div class="slim-card-list" id="savedJobList"></div>
            </div>
            <div class="tab-view" id="appliedTab">
                <div class="slim-card-list" id="appliedJobList"></div>
            </div>
            <div class="tab-view" id="profileTab">
                <div id="profileView"></div>
                <div id="profileShield">
                    <div class="glass-panel">
                        <div class="section-label-modal">
                            <i data-lucide="shield-check" style="width: 12px; height: 12px;"></i> Chania Verification Shield
                        </div>
                        <div class="detail-block" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="scalloped-badge lg">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M12 0L14.59 2.05L17.89 1.62L19.34 4.61L22.47 5.76L22.42 9.09L24.8 11.45L23.27 14.41L24.32 17.57L21.13 18.52L20.8 21.84L17.51 21.28L15.3 23.78L12.01 22.88L9.57 24.8L7.38 22.25L4.1 22.7L3.65 19.39L0.5 18.33L1.44 15.14L0 12.13L2.27 9.68L2.11 6.35L5.27 5.32L6.82 2.38L10.08 2.92L12 0Z" fill="#0052FF"/>
                                        <path d="M7.5 12L10.5 15L16.5 9" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                                <div>
                                    <div style="font-size: 12.5px; font-weight: 700; color: var(--text-primary);">Smartika Trust Network</div>
                                    <div style="font-size: 10.5px; color: var(--text-muted);">Verified Credentials Active</div>
                                </div>
                            </div>
                            <span style="font-size: 11px; font-weight: 800; color: var(--emerald-green);">VERIFIED</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FIXED FLOATING ACTION BUTTON (FAB) - OPENS CHAT UI -->
        <button class="fab-kazini" onclick="openChatModal()" aria-label="Open Chania Assistant">
            <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="18" y="34" width="64" height="48" rx="12" stroke="#FF5500" stroke-width="8" fill="none"/>
                <path d="M38 34 V22 C38 18.5 41 16 45 16 H55 C59 16 62 18.5 62 22 V34" stroke="#FF5500" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M82 10 Q82 22 94 22 Q82 22 82 34 Q82 22 70 22 Q82 22 82 10 Z" fill="#FF5500"/>
            </svg>
        </button>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-container">
                <div class="nav-item active" onclick="switchTab(this, 'discoverTab')">
                    <i data-lucide="compass" style="width:20px; height:20px;"></i>
                    <span>Discover</span>
                </div>
                <div class="nav-item" onclick="switchTab(this, 'savedTab')">
                    <i data-lucide="heart" style="width:20px; height:20px;"></i>
                    <span>Saved</span>
                </div>
                <div class="nav-item" onclick="switchTab(this, 'appliedTab')">
                    <i data-lucide="clipboard-list" style="width:20px; height:20px;"></i>
                    <span>Applied</span>
                </div>
                <div class="nav-item" onclick="switchTab(this, 'profileTab')">
                    <i data-lucide="user" style="width:20px; height:20px;"></i>
                    <span>Profile</span>
                </div>
            </div>
        </div>

        <!-- CHAT UI MODAL (CLOSE BUTTON HIDDEN UNTIL ONBOARDING CONFIRMED) -->
        <div class="modal-overlay" id="chatModal" style="display: flex;">
            <div class="chat-modal-card" onclick="event.stopPropagation()">
                <div class="chat-header">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div class="chat-avatar-wrapper">
                            <img src="kazini-ai-avatar.png" alt="Chania AI" class="chat-avatar-img">
                            <span style="position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: var(--emerald-green); border: 2.5px solid var(--bg-sticky); border-radius: 50%;"></span>
                        </div>
                        <div>
                            <div style="font-size: 14.5px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 5px;">
                                Chania AI
                                <span class="scalloped-badge" title="Verified Assistant">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M12 0L14.59 2.05L17.89 1.62L19.34 4.61L22.47 5.76L22.42 9.09L24.8 11.45L23.27 14.41L24.32 17.57L21.13 18.52L20.8 21.84L17.51 21.28L15.3 23.78L12.01 22.88L9.57 24.8L7.38 22.25L4.1 22.7L3.65 19.39L0.5 18.33L1.44 15.14L0 12.13L2.27 9.68L2.11 6.35L5.27 5.32L6.82 2.38L10.08 2.92L12 0Z" fill="#0052FF"/>
                                        <path d="M7.5 12L10.5 15L16.5 9" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                            </div>
                            <div style="font-size: 11px; color: var(--emerald-green); font-weight: 700; margin-top: 2px;">
                                Job Hunting Agent
                            </div>
                        </div>
                    </div>
                    <!-- Close button hidden during onboarding -->
                </div>

                <div class="chat-messages-container" id="chatMessages"></div>
                <div class="quick-replies-footer" id="quickRepliesFooter" style="display:none"></div>

                <div class="chat-input-area">
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
                    <button class="chat-attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach Resume or Document">
                        <i data-lucide="paperclip" style="width: 17px; height: 17px;"></i>
                    </button>
                    <input type="text" class="chat-input" id="chatInput" placeholder="Type your response..." onkeypress="handleChatKeypress(event)">
                    <button class="chat-send-btn" onclick="sendChatMessage()">
                        <i data-lucide="send" style="width: 16px; height: 16px;"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CHANIA AI GEMINI LLM & ONBOARDING ENGINE ---
        const onboardingSteps = [
            { key: 'full_name', prompt: "So, what is your full name? (e.g. John Kamau)" },
            { key: 'gender', prompt: "Are you male or female?", options: ["Male", "Female"] },
            { key: 'education', prompt: "What is your highest education level?", options: ["Kcse", "Diploma", "Degree", "Masters", "PHD"] },
            { key: 'institution', prompt: "Which institution did you attend?" },
            { key: 'course', prompt: "What did you study?" },
            { key: 'education_period', prompt: "When did you attend? (e.g. 2020 - 2024)" },
            { key: 'skills', prompt: "What skills do you have? (e.g. Python, SQL, Excel)" },
            { key: 'work_experience', prompt: "Do you have any work experience?", options: ["Yes", "No"] },
            { key: 'currently_working', prompt: "Are you currently working?", options: ["Yes", "No"], condition: (p) => p.work_experience === 'Yes' },
            { key: 'workplace', prompt: "Where do you currently work?", condition: (p) => p.currently_working === 'Yes' },
            { key: 'job_title', prompt: "What is your current job title?", condition: (p) => p.currently_working === 'Yes' },
            { key: 'responsibilities', prompt: "What are your responsibilities?", condition: (p) => p.currently_working === 'Yes' },
            { key: 'work_period', prompt: "When did you start working there? (e.g. Jan 2023)", condition: (p) => p.currently_working === 'Yes' },
            { key: 'related_to_study', prompt: "Is your current job related to your course of study?", options: ["Yes", "No"], condition: (p) => p.currently_working === 'Yes' },
            { key: 'past_any', prompt: "Do you have any past jobs?", options: ["Yes", "No"], condition: (p) => p.work_experience === 'Yes' },
            { key: 'certifications', prompt: "Do you have any certifications?" },
            { key: 'projects', prompt: "Do you have any projects?", options: ["Yes", "No"] },
            { key: 'project_details', prompt: "Please tell me about your project.", condition: (p) => p.projects === 'Yes' },
            { key: 'achievements', prompt: "What achievements do you have?" },
            { key: 'languages', prompt: "What languages do you speak?" },
            { key: 'phone', prompt: "What is your phone number? (e.g. 0712 345 678)" }
        ];

        let onboardingIndex = 0;
        let userProfile = {};
        let onboardingActive = true;
        let waitingForRedirectionReply = false;
        let profileConfirmed = false;

        function initChat() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            appendMessage("assistant", "Welcome back 👋 I found some fresh job matches for you today! [ 💼 My Jobs Today ]");
            showQuickReplies(["💼 My Jobs Today"]);
        }

        function appendMessage(sender, text) {
            const container = document.getElementById('chatMessages');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`;
            bubble.innerText = text;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
            lucide.createIcons();
        }

        function showQuickReplies(options) {
            const footer = document.getElementById('quickRepliesFooter');
            footer.innerHTML = '';
            if (!options || options.length === 0) {
                footer.style.display = 'none';
                return;
            }
            footer.style.display = 'flex';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quick-reply-chip';
                btn.innerText = opt;
                btn.onclick = () => handleUserResponse(opt);
                footer.appendChild(btn);
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            appendMessage('user', val);
            handleUserResponse(val);
        }

        function handleChatKeypress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function handleUserResponse(input) {
            showQuickReplies([]);

            if (input === "[ 💼 My Jobs Today ]" || input === "💼 My Jobs Today") {
                appendMessage('assistant', "Let's get your career profile set up first! " + onboardingSteps[0].prompt);
                showQuickReplies(onboardingSteps[0].options || []);
                return;
            }

            if (waitingForRedirectionReply) {
                const lower = input.toLowerCase();
                if (lower.includes("yes") || lower === "sure") {
                    waitingForRedirectionReply = false;
                    const currentStep = onboardingSteps[onboardingIndex];
                    appendMessage('assistant', currentStep.prompt);
                    showQuickReplies(currentStep.options || []);
                } else {
                    waitingForRedirectionReply = false;
                    appendMessage('assistant', "No problem! You can resume whenever you are ready. Chania AI 😊");
                }
                return;
            }

            if (onboardingActive && onboardingIndex < onboardingSteps.length) {
                const currentStep = onboardingSteps[onboardingIndex];
                
                // Off-topic check heuristic
                if (currentStep.key === 'full_name' && (input.length > 40 || /weather|joke|football/i.test(input))) {
                    waitingForRedirectionReply = true;
                    appendMessage('assistant', "I'm sorry, I don't have that information. Should we continue with your career profile creation?");
                    showQuickReplies(["Yes", "No"]);
                    return;
                }

                userProfile[currentStep.key] = input;
                onboardingIndex++;

                // Skip steps based on conditions
                while (onboardingIndex < onboardingSteps.length) {
                    const nextStep = onboardingSteps[onboardingIndex];
                    if (nextStep.condition && !nextStep.condition(userProfile)) {
                        onboardingIndex++;
                    } else {
                        break;
                    }
                }

                if (onboardingIndex < onboardingSteps.length) {
                    const nextStep = onboardingSteps[onboardingIndex];
                    appendMessage('assistant', nextStep.prompt);
                    showQuickReplies(nextStep.options || []);
                } else {
                    onboardingActive = false;
                    profileConfirmed = true;
                    appendMessage('assistant', "Your profile has been confirmed successfully! Your career profile is now active. Chania AI 😊");
                    
                    // Enable close button or close modal & let user navigate app
                    setTimeout(() => {
                        closeChatModal();
                    }, 2000);
                }
            } else {
                appendMessage('assistant', "Your profile is fully confirmed. You can now explore your job matches! Chania AI 😊");
            }
        }

        function openChatModal() {
            document.getElementById('chatModal').style.display = 'flex';
        }

        function closeChatModal() {
            if (!profileConfirmed) return; // Prevent closing until profile is confirmed
            document.getElementById('chatModal').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            initChat();
            openChatModal(); // Pop immediately upon load
        });

        // Theme and Navigation Support
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const icon = document.getElementById('themeIcon');
            icon.setAttribute('data-lucide', document.body.classList.contains('dark-theme') ? 'sun' : 'moon');
            lucide.createIcons();
        }

        function switchTab(el, tabId) {
            if (!profileConfirmed) {
                alert("Please complete your career profile setup in the chat first!");
                openChatModal();
                return;
            }
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
