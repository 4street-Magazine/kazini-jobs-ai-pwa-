<title>Chania AI</title>
<script>
/* Hosts like GitHub Pages show this page for any address that is not a real file. An agent link (/a/CODE) is sent on to the app with the code attached; anything else goes to the home page. */
(function () {
  var m = location.pathname.match(/^\/a\/([A-Za-z0-9]{3,16})\/?$/);
  location.replace(m ? '/?ref=' + m[1].toUpperCase() : '/');
})();
</script>
